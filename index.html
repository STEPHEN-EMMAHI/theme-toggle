<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg" href="/favicon-32x32.png" />
    <meta
      name="description"
      content="A simple light and dark mode toggle project"
    />
    <link rel="stylesheet" href="/src/view/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>theme-toggle</title>
  </head>
  <body>
    <div
      class="container flex gap-16 flex-col items-center justify-center h-screen"
    >
      <!-- HEADER -->
      <header>
        <h1 class="appearance font-bold text-3xl">Appearance Mode</h1>
      </header>

      <!-- MAIN -->
      <main>
        <div class="border-gray-200 rounded-full p-2 ring-2 ring-gray-200">
          <div class="buttonContainer flex gap-8 bg-gray-200 p-4 rounded-full">
            <button
              aria-label="toggleMode-Btn"
              id="lightModeBtn"
              class="scale-130 transition-transform duration-200 ease-in-out text-amber-500"
            >
              <!-- lightMode -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
            </button>
            <button class="text-zinc-400" id="darkModeBtn">
              <!-- darkMode -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
              </svg>
            </button>
          </div>
        </div>
      </main>

      <footer>
        <p class="textBottom">Toggle the switch to change mode</p>
      </footer>
    </div>
    <script type="module" src="/src/controller/main.js"></script>
  </body>
</html>
