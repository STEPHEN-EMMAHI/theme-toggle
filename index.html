<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg" href="/favicon-32x32.png" />
    <meta
      name="content"
      description="A simple light and dark mode toggle project"
    />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>theme-toggle</title>
  </head>
  <body>
    <div
      class="flex gap-16 flex-col items-center justify-center h-screen dark:bg-zinc-900"
    >
      <!-- HEADER -->
      <header>
        <h1 class="font-bold text-3xl dark:text-white">Appearance Mode</h1>
      </header>

      <!-- MAIN -->
      <main>
        <div
          class="border-gray-200 rounded-full p-2 ring-2 ring-gray-200 dark:border-zinc-800 dark:ring-gray-600"
        >
          <button
            class="flex gap-8 bg-gray-200 p-4 rounded-full dark:bg-zinc-800"
          >
            <div
              class="scale-130 transition-transform duration-200 ease-in-out text-amber-500"
            >
              <!-- lightMode -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="50"
                height="50"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
            </div>
            <div class="text-zinc-700">
              <!-- darkMode -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="50"
                height="50"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
              </svg>
            </div>
          </button>
        </div>
      </main>

      <footer>
        <p class="dark:text-white">Toggle the switch to change mode</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
